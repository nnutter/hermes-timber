name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
      - name: Install Python dependencies
        run: uv sync
      - name: Install Node dependencies
        run: npm ci
      - name: Check out Hermes for the backend tests
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          echo "HERMES_SOURCE=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"
      - name: Run checks
        run: mise run check
      - name: Run tests
        run: mise run test
      - name: Build the Desktop plugin
        run: mise run build
